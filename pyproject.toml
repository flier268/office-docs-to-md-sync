[project]
name = "office-docs-to-md-sync"
version = "0.1.0"
description = "Local web app for watching Office documents and syncing them as Markdown."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "apscheduler>=3.11.3,<4.0.0",
  "fastapi>=0.162.0,<1.0.0",
  "gitpython>=3.2.1,<4.0.0",
  "markitdown[docx,pptx,xlsx,xls,pdf]>=0.1.9",
  "pydantic>=2.14.2,<3.0.0",
  "uvicorn>=0.54.0,<1.0.0",
  "watchdog>=6.0.0,<8.0.0",
]

[project.scripts]
office-docs-to-md-sync = "app.main:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1,<1.0.0",
  "pytest>=9.0.0,<10.0.0",
]

[build-system]
requires = ["setuptools>=84.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*.html", "static/*.js", "static/*.css"]

[tool.uv]
exclude-dependencies = [
    "magika",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
